services:
  - type: web
    name: bellamy-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: BOT_NAME
        value: BELLAMY
      - key: OFFICIAL_CHANNEL_ID
        sync: false
      - key: OFFICIAL_CHANNEL_LINK
        sync: false
      - key: OFFICIAL_GROUP_ID
        sync: false
      - key: OFFICIAL_GROUP_LINK
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bellamy-db
          property: connectionString

databases:
  - name: bellamy-db
    plan: free
    databaseName: bellamy
    user: bellamy
